<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow DOM fixture</title>
</head>
<body>
<h1>Shadow DOM fixture</h1>
<main>
<shadow-card></shadow-card>
</main>
<script>
    // Imperative open shadow roots — the scanner must serialize them into
    // <template shadowrootmode> markers or markup rules stay blind. Built via
    // createElement so the script source carries no markup the static rules
    // could double-count. Nested host exercises post-order expansion; the
    // shadow button is the only focusable, so the census must pierce roots.
    class ShadowInner extends HTMLElement {
        connectedCallback() {
            const img = document.createElement("img");
            img.src = "icon-192.png";
            img.width = 48; img.height = 48;
            this.attachShadow({ mode: "open" }).append(img);
        }
    }
    class ShadowCard extends HTMLElement {
        connectedCallback() {
            const img = document.createElement("img");
            img.src = "icon-192.png";
            img.width = 48; img.height = 48;
            const inner = document.createElement("shadow-inner");
            const btn = document.createElement("button");
            btn.id = "innerBtn";
            btn.textContent = "Shadow button";
            btn.style.cssText = "padding:14px 22px;font-size:1rem";
            this.attachShadow({ mode: "open" }).append(img, inner, btn);
        }
    }
    customElements.define("shadow-inner", ShadowInner);
    customElements.define("shadow-card", ShadowCard);
</script>
</body>
</html>
