[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lazynext-accessibility-checker"
version = "1.0.0"
description = "Accessibility Checker API client — WCAG 2.1/2.2 scans, site crawls, reports, monitors."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[tool.setuptools]
py-modules = ["lazynext_a11y"]
